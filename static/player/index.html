<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff"><meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow"><title>课程回放</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="config.js" defer></script><script src="offline.js" defer></script><script src="playback.js?v=4" defer></script><script src="app.js?v=4" defer></script>
</head>
<body>
  <header><h1>课程回放</h1></header>
  <main>
    <section class="watch" aria-label="播放器">
      <div class="heading"><h2 id="now-title">选择一节回放</h2><span id="now-date"></span></div>
      <div id="player" class="player" tabindex="0" aria-label="课程播放器">
      <div id="stage" class="stage" data-mode="single" data-main="primary">
        <div id="primary-panel" class="video-panel"><span id="primary-label" class="video-label">教师</span><video id="video" playsinline webkit-playsinline preload="auto" crossorigin="anonymous" disablepictureinpicture></video></div>
        <div id="secondary-panel" class="video-panel" hidden><span id="secondary-label" class="video-label">PPT</span><video id="secondary" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous" disablepictureinpicture aria-label="同步画面"></video></div>
        <div id="caption-line" class="caption-line" aria-label="当前字幕" hidden></div>
        <button id="swap" class="swap" disabled>交换画面</button>
        <p id="player-status" class="status" role="status"></p>
      </div>
      <div class="player-controls">
      <div class="transport"><button id="play" disabled aria-label="播放">播放</button><button id="back" disabled aria-label="后退 15 秒">−15秒</button><button id="forward" disabled aria-label="前进 15 秒">+15秒</button><span id="clock">00:00 / 00:00</span><button id="fullscreen" disabled>全屏</button></div>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度" disabled>
      <div class="toolbar">
        <select id="layout" aria-label="显示画面" disabled><option value="dual">教师＋PPT小窗</option></select>
        <div id="rates" class="segments" role="group" aria-label="播放速度"><button data-rate="1">1×</button><button data-rate="1.5">1.5×</button><button data-rate="2">2×</button><button data-rate="2.5">2.5×</button><button data-rate="3">3×</button></div>
        <button id="caption-toggle" aria-pressed="true" disabled>字幕</button><select id="caption-size" aria-label="字幕大小"><option value="small">小字</option><option value="normal" selected>标准字</option><option value="large">大字</option></select>
      </div>
      </div></div>
      <div class="actions"><button id="refresh-media" disabled>重连</button><button id="download" disabled>保存离线</button></div>
      <p id="download-note" class="status" role="status"></p>
      <progress id="download-progress" max="1" value="0" hidden aria-label="离线保存进度"></progress>
    </section>
    <aside class="library">
      <div class="tabs" role="group" aria-label="课程来源"><button id="online-tab" class="active" aria-pressed="true">课程</button><button id="offline-tab" aria-pressed="false">离线 <span id="offline-count">0</span></button><button id="reload" class="reload">刷新</button></div>
      <div id="online-panel"><select id="courses" aria-label="选择课程" disabled><option>正在读取课程…</option></select><p id="list-status" class="status" role="status"></p><div id="recordings" class="recordings"></div></div>
      <div id="offline-panel" hidden><div id="offline-list" class="recordings"></div><p class="status">离线视频保存在当前浏览器中。</p></div>
    </aside>
  </main>
</body></html>
